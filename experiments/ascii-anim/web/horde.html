<title>Lantern Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* There is no chrome left to style. The whole screen is one character grid
     drawn on a single canvas, so this file only has to place that canvas and
     paint the ground behind it. */
  :root { --ground: #06060d; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); overflow: hidden;
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  #screen { display: block; width: 100%; height: 100%; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
</style>

<h1 class="sr">Lantern Hours &mdash; an ASCII survivors-like</h1>
<p class="sr">
  Move with WASD or the arrow keys; every weapon fires itself. Press 1, 2 or 3
  to choose on level up, and R to start over.
</p>
<p class="sr" id="say" aria-live="polite" role="status"></p>
<canvas id="screen"></canvas>

<script>
(function () {
  "use strict";

  // ===========================================================================
  // Everything on screen is a character in one grid: the frame, the status
  // lines, the loadout and the field. The cell is a console box, 1 wide by 2
  // tall (CLAUDE.md), and the grid is repainted by difference (BENCH.md).
  // ===========================================================================
  var CELL_W = 13, CELL_H = 26;
  var YS = 2;                       // world units per cell row

  var PAL = ["#000000","#3b4cc0","#00aa00","#00aaaa","#aa0000","#aa00aa",
             "#aa5500","#8f8caa","#3a3856","#5555ff","#55ff55","#55ffff",
             "#ff5555","#ff55ff","#ffff55","#ffffff",
             "#c77dff","#7a3fb0","#1a1a2e","#12121f","#5b5580","#2b2745"];
  var C = { grass:18, grass2:19, us:16, xp:11, ink:15, label:20, frame:21,
            dim:7, hurt:12, gold:14 };

  var GLYPHS = (" .,'\"`:;*#@%^~=-+|/\\_<>()[]{}!?$&0123456789"
    + "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    + "·═║╔╗╚╝"
    + "─│┌┐└┘").split("");
  var GI = {};
  GLYPHS.forEach(function (g, i) { if (GI[g] === undefined) GI[g] = i; });
  var RAMP = [GI[":"], GI[";"], GI["*"], GI["#"], GI["@"]];

  function ri(n) { return Math.floor(Math.random() * n); }
  function rnd(n) { return Math.random() * n; }
  function pad(s, n) { s = String(s); return s.length >= n ? s : s + " ".repeat(n - s.length); }
  function mmss(x) {
    var s = Math.max(0, Math.floor(x));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  // ===========================================================================
  // Foes -- glyphs, colours and stat shapes from dat/mons/*.yaml
  // ===========================================================================
  var FOES = [
    { id:"rat",      g:"r", c:6,  hp:3,  sp:7.5, dmg:4,  from:0 },
    { id:"bat",      g:"b", c:7,  hp:2,  sp:13,  dmg:3,  from:0, weave:true },
    { id:"jackal",   g:"h", c:6,  hp:4,  sp:10,  dmg:5,  from:0.5 },
    { id:"goblin",   g:"g", c:7,  hp:6,  sp:7,   dmg:6,  from:1 },
    { id:"adder",    g:"S", c:10, hp:8,  sp:8.5, dmg:7,  from:1.5 },
    { id:"orc",      g:"o", c:12, hp:12, sp:7,   dmg:9,  from:2 },
    { id:"hound",    g:"h", c:14, hp:14, sp:11,  dmg:9,  from:2.5 },
    { id:"ufetubus", g:"5", c:11, hp:10, sp:12,  dmg:8,  from:3, weave:true },
    { id:"ogre",     g:"O", c:6,  hp:44, sp:5.5, dmg:18, from:3.5 }
  ];

  // ===========================================================================
  // Arms -- each drawn by a primitive lifted out of Crawl
  // ===========================================================================
  var ARMS = [
    { id:"whip", g:"~", name:"Whip", kind:"weapon",
      src:"bolt::draw - beam.cc:721",
      desc:"Lashes out to both sides along the ground.",
      per:function (L) { return { cd: 1.15 - L*0.09, dmg: 9 + L*6, len: 13 + L*2.6 }; } },
    { id:"knives", g:"/", name:"Knives", kind:"weapon",
      src:"bolt::draw - beam.cc:721",
      desc:"Throws at whatever is nearest. Pierces what it passes.",
      per:function (L) { return { cd: 0.75 - L*0.05, dmg: 7 + L*4, n: 1 + Math.floor(L/2) }; } },
    { id:"censer", g:"o", name:"Censer", kind:"weapon",
      src:"draw_ring_animation - view.cc:787",
      desc:"A ring of smoke that keeps burning everything close.",
      per:function (L) { return { cd: 1.5 - L*0.11, dmg: 6 + L*4, r: 5 + L*1.5 }; } },
    { id:"firepot", g:"*", name:"Fire pot", kind:"weapon",
      src:"bolt::explode sweep - beam.cc:6985",
      desc:"Lobbed into the thick of them. Blooms outward.",
      per:function (L) { return { cd: 2.4 - L*0.16, dmg: 20 + L*12, r: 4 + L*0.9 }; } },
    { id:"arc", g:"|", name:"Arc", kind:"weapon",
      src:"bolt::draw, chained - beam.cc:721",
      desc:"Jumps from foe to foe until it runs out of leaps.",
      per:function (L) { return { cd: 1.9 - L*0.13, dmg: 12 + L*7, hops: 3 + L }; } },
    { id:"lantern", g:"0", name:"Lantern", kind:"weapon",
      src:"orb_animation - view.cc:519",
      desc:"A slow wave of light that sweeps the whole field.",
      per:function (L) { return { cd: 9 - L*0.55, dmg: 34 + L*20, r: 26 + L*5 }; } },

    { id:"boots", g:"[", name:"Swift boots", kind:"passive", src:"",
      desc:"You move faster.",
      per:function (L) { return { move: 1 + L*0.13 }; } },
    { id:"heart", g:"%", name:"Stout heart", kind:"passive", src:"",
      desc:"More life, and some of it back now.",
      per:function (L) { return { hp: L*22 }; } },
    { id:"stone", g:"$", name:"Lodestone", kind:"passive", src:"",
      desc:"Pulls loose sparks in from further off.",
      per:function (L) { return { pick: 8 + L*3.6 }; } },
    { id:"glass", g:"!", name:"Hourglass", kind:"passive", src:"",
      desc:"Everything you carry comes round sooner.",
      per:function (L) { return { haste: 1 - L*0.07 }; } }
  ];
  var MAX_SLOTS = 6;
  var RUN_LENGTH = 300;

  // ===========================================================================
  // State
  // ===========================================================================
  var cv = document.getElementById("screen"), ctx = cv.getContext("2d", { alpha:false });
  var cols = 0, rows = 0, buf = null, prev = null, forceFull = true;
  var counts = null, owner = null;
  var F = { x:1, y:3, w:10, h:10 };           // the field, in cells
  var you, foes, gems, fx, t, over_, paused, kills, stat, offer, hitRects;
  var keys = Object.create(null);
  var shake = 0, flash = 0;

  function statsOf() {
    var s = { move:1, hp:0, pick:8, haste:1 };
    you.arms.forEach(function (a) {
      if (a.def.kind !== "passive") return;
      var p = a.def.per(a.lv);
      if (p.move) s.move = p.move;
      if (p.hp) s.hp = p.hp;
      if (p.pick) s.pick = p.pick;
      if (p.haste) s.haste = p.haste;
    });
    return s;
  }

  // ===========================================================================
  // Grid painting
  // ===========================================================================
  var CLIP = null;
  function clip(x, y, w, h) { CLIP = { x:x, y:y, w:w, h:h }; }
  function unclip() { CLIP = null; }
  function put(cx, cy, g, c) {
    cx |= 0; cy |= 0;
    if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) return;
    if (CLIP && (cx < CLIP.x || cy < CLIP.y
                 || cx >= CLIP.x + CLIP.w || cy >= CLIP.y + CLIP.h)) return;
    buf[cy * cols + cx] = g << 8 | c;
  }
  function putStr(cx, cy, s, c) {
    for (var i = 0; i < s.length; i++) {
      var gi = GI[s.charAt(i)];
      if (gi !== undefined) put(cx + i, cy, gi, c);
    }
  }
  function hfill(x, y, w, ch, c) {
    var gi = GI[ch];
    for (var i = 0; i < w; i++) put(x + i, y, gi, c);
  }
  // A framed panel, in the double line Crawl uses for CSET_DEFAULT frames.
  function panel(x, y, w, h, c) {
    for (var i = 1; i < w - 1; i++) {
      put(x + i, y, GI["═"], c);
      put(x + i, y + h - 1, GI["═"], c);
    }
    for (var j = 1; j < h - 1; j++) {
      put(x, y + j, GI["║"], c);
      put(x + w - 1, y + j, GI["║"], c);
      hfill(x + 1, y + j, w - 2, " ", c);
    }
    put(x, y, GI["╔"], c);            put(x + w - 1, y, GI["╗"], c);
    put(x, y + h - 1, GI["╚"], c);    put(x + w - 1, y + h - 1, GI["╝"], c);
  }
  // [=======-------]
  function bar(x, y, w, frac, cFull, cEmpty) {
    var inner = w - 2;
    var n = Math.max(0, Math.min(inner, Math.round(frac * inner)));
    put(x, y, GI["["], cEmpty);
    for (var i = 0; i < inner; i++)
      put(x + 1 + i, y, GI[i < n ? "=" : "-"], i < n ? cFull : cEmpty);
    put(x + w - 1, y, GI["]"], cEmpty);
  }

  // ===========================================================================
  // Layout -- the whole screen, measured in cells
  // ===========================================================================
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    CELL_W = Math.max(7, Math.min(16, Math.floor(w / 96)));
    CELL_H = CELL_W * 2;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cols = Math.max(40, Math.floor(w / CELL_W));
    rows = Math.max(16, Math.floor(h / CELL_H));
    cv.width = Math.round(cols * CELL_W * dpr);
    cv.height = Math.round(rows * CELL_H * dpr);
    cv.style.width = (cols * CELL_W) + "px";
    cv.style.height = (rows * CELL_H) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.font = Math.round(CELL_H * 0.74) + "px " +
      getComputedStyle(document.body).fontFamily;
    buf = new Int32Array(cols * rows);
    prev = new Int32Array(cols * rows).fill(-1);
    // rows: 0 frame, 1 status, 2 rule, [field], rule, hp, load, frame
    F.x = 1; F.y = 3; F.w = cols - 2; F.h = Math.max(8, rows - 7);
    counts = new Uint16Array(F.w * F.h);
    owner = new Int32Array(F.w * F.h);
    forceFull = true;
  }

  function camL() { return you.x - F.w / 2; }
  function camT() { return you.y - F.h * YS / 2; }
  function toCellX(wx) { return F.x + (wx - camL()); }
  function toCellY(wy) { return F.y + (wy - camT()) / YS; }

  // ===========================================================================
  // Chrome, drawn as characters
  // ===========================================================================
  function drawShell() {
    var c = C.frame;
    // outer frame
    hfill(1, 0, cols - 2, "═", c);
    hfill(1, rows - 1, cols - 2, "═", c);
    for (var j = 1; j < rows - 1; j++) {
      put(0, j, GI["║"], c);
      put(cols - 1, j, GI["║"], c);
    }
    put(0, 0, GI["╔"], c);             put(cols - 1, 0, GI["╗"], c);
    put(0, rows - 1, GI["╚"], c);      put(cols - 1, rows - 1, GI["╝"], c);
    // rules above and below the field
    hfill(1, 2, cols - 2, "═", c);
    hfill(1, rows - 4, cols - 2, "═", c);

    var s = statsOf();
    var right = cols - 2;

    // --- status line -------------------------------------------------------
    var x = 2;
    putStr(x, 1, "LANTERN HOURS", C.us); x += 15;
    if (cols > 62) { putStr(x, 1, "SURVIVED", C.label); x += 9; }
    putStr(x, 1, mmss(t), C.ink); x += 6;
    putStr(x, 1, "LV", C.label); x += 3;
    putStr(x, 1, pad(you.lv, 3), C.ink); x += 3;
    if (cols > 74) {
      putStr(x, 1, "XP", C.label); x += 3;
      bar(x, 1, 12, you.xp / you.need, C.xp, C.frame); x += 13;
      putStr(x, 1, you.xp + "/" + you.need, C.dim);
    }
    var goal = "GOAL " + mmss(RUN_LENGTH);
    putStr(right - goal.length + 1, 1, goal, C.label);

    // --- vitals line -------------------------------------------------------
    var y = rows - 3;
    x = 2;
    putStr(x, y, "HP", C.label); x += 3;
    bar(x, y, 18, Math.max(0, you.hp / you.maxhp), C.hurt, C.frame); x += 19;
    putStr(x, y, Math.max(0, Math.round(you.hp)) + "/" + Math.round(you.maxhp), C.ink);
    x += 9;
    if (cols > 68) {
      putStr(x, y, "FOES", C.label); putStr(x + 5, y, pad(foes.length, 5), C.ink);
      x += 10;
      putStr(x, y, "KILLS", C.label); putStr(x + 6, y, pad(kills, 6), C.ink);
      x += 12;
    }
    if (cols > 92) {
      var perf = "fx " + fx.length + "  repaint " + stat.dirty
               + "  " + stat.ms.toFixed(1) + "ms";
      putStr(right - perf.length + 1, y, perf, C.frame);
    }

    // --- loadout line ------------------------------------------------------
    y = rows - 2;
    x = 2;
    if (!you.arms.length) putStr(x, y, "nothing yet - walk over the sparks", C.frame);
    you.arms.forEach(function (a) {
      var tag = a.def.g + " " + a.def.name + " " + a.lv;
      if (x + tag.length + 2 > right) return;
      putStr(x, y, a.def.g, a.def.kind === "passive" ? C.xp : C.us);
      putStr(x + 2, y, a.def.name, C.dim);
      putStr(x + 2 + a.def.name.length + 1, y, String(a.lv), C.ink);
      x += tag.length + 3;
    });
  }

  // ===========================================================================
  // Field
  // ===========================================================================
  function drawField() {
    clip(F.x, F.y, F.w, F.h);
    counts.fill(0);
    var L = camL(), T = camT();

    for (var cy = 0; cy < F.h; cy++) for (var cx = 0; cx < F.w; cx++) {
      var wx = Math.floor(L) + cx, wy = Math.floor(T / YS) + cy;
      var h = (wx * 73856093 ^ wy * 19349663) >>> 0;
      var g = (h % 23 === 0) ? GI[","] : (h % 11 === 0) ? GI["."] : 0;
      put(F.x + cx, F.y + cy, g, (h % 23 === 0) ? C.grass : C.grass2);
    }

    for (var i = 0; i < gems.length; i++) {
      var gm = gems[i];
      put(toCellX(gm.x), toCellY(gm.y), GI[gm.pull ? "*" : "."], gm.pull ? C.xp : 3);
    }

    for (var f = 0; f < foes.length; f++) {
      var m = foes[f];
      var px = (toCellX(m.x) | 0) - F.x, py = (toCellY(m.y) | 0) - F.y;
      if (px < 0 || py < 0 || px >= F.w || py >= F.h) continue;
      var id = py * F.w + px;
      counts[id]++;
      owner[id] = f;
    }
    for (var k = 0; k < counts.length; k++) {
      var n = counts[k];
      if (!n) continue;
      var m2 = foes[owner[k]];
      put(F.x + (k % F.w), F.y + ((k / F.w) | 0),
          n === 1 ? GI[m2.def.g] : RAMP[Math.min(4, n - 1)],
          m2.hurt > 0 ? C.ink : m2.def.c);
    }

    stampFX();
    put(toCellX(you.x), toCellY(you.y), GI["@"], you.iframe > 0 ? C.ink : C.us);
    unclip();
  }

  function stampFX() {
    for (var i = 0; i < fx.length; i++) {
      var e = fx[i], p = 1 - e.life / e.max, j;
      if (e.k === "num") continue;

      if (e.k === "line") {
        var n = Math.max(1, Math.round(Math.hypot(
          toCellX(e.x1) - toCellX(e.x0), toCellY(e.y1) - toCellY(e.y0))));
        for (j = 0; j <= n; j++) {
          if (j / n > p + 0.42) break;
          put(toCellX(e.x0) + (toCellX(e.x1) - toCellX(e.x0)) * j / n,
              toCellY(e.y0) + (toCellY(e.y1) - toCellY(e.y0)) * j / n, GI[e.g], e.c);
        }
      } else if (e.k === "ring") {
        var rr = e.r * p;
        for (j = 0; j < 44; j++) {
          var th = j / 44 * Math.PI * 2;
          put(toCellX(e.x + Math.cos(th) * rr), toCellY(e.y + Math.sin(th) * rr),
              GI[e.g], e.c);
        }
      } else if (e.k === "burst") {
        var band = e.r * p;
        for (var dy = -e.r; dy <= e.r; dy += 0.5)
          for (var dx = -e.r; dx <= e.r; dx += 0.5) {
            var d = Math.hypot(dx, dy);
            if (d > band || d < band - 1.4) continue;
            put(toCellX(e.x + dx), toCellY(e.y + dy), GI["#"], e.c);
          }
      } else if (e.k === "wave") {
        var lo = e.r * p, hi = lo + 2.4;
        for (var a = 0; a < 190; a++) {
          var an = a / 190 * Math.PI * 2, rad = lo + Math.random() * (hi - lo);
          put(toCellX(e.x + Math.cos(an) * rad), toCellY(e.y + Math.sin(an) * rad),
              GI["*"], e.c);
        }
      } else if (e.k === "pop") {
        var pr = 1.6 * p;
        for (j = 0; j < 8; j++) {
          var pa = j / 8 * Math.PI * 2;
          put(toCellX(e.x + Math.cos(pa) * pr), toCellY(e.y + Math.sin(pa) * pr),
              GI["'"], e.c);
        }
      }
    }
    // numbers last, so nothing paints over a digit
    for (var q = 0; q < fx.length; q++) {
      var d2 = fx[q];
      if (d2.k !== "num") continue;
      var pr2 = 1 - d2.life / d2.max;
      putStr(toCellX(d2.x) - (d2.s.length / 2 | 0),
             toCellY(d2.y) - 1 - pr2 * 2.2, d2.s, d2.c);
    }
  }

  // ===========================================================================
  // Overlays -- also characters
  // ===========================================================================
  function drawLevelUp() {
    var w = Math.min(66, cols - 6);
    var h = Math.min(rows - 4, 3 + offer.length * 4);
    var x = ((cols - w) / 2) | 0, y = ((rows - h) / 2) | 0;
    panel(x, y, w, h, C.us);
    putStr(x + 3, y, " THE LANTERN BRIGHTENS ", C.us);
    var sub = you.arms.length >= MAX_SLOTS
      ? "hands full - only what you carry can grow"
      : "take one";
    putStr(x + w - sub.length - 4, y + 1, sub, C.frame);
    putStr(x + 3, y + 1, "level " + you.lv, C.label);

    hitRects = [];
    var ry = y + 3;
    offer.forEach(function (d, i) {
      var have = you.arms.filter(function (a) { return a.def.id === d.id; })[0];
      putStr(x + 3, ry, "[" + (i + 1) + "]", C.us);
      putStr(x + 7, ry, d.g, C.gold);
      putStr(x + 9, ry, d.name, C.ink);
      var lv = have ? "lv " + have.lv + " -> " + (have.lv + 1) : "new";
      putStr(x + w - lv.length - 3, ry, lv, C.label);
      putStr(x + 7, ry + 1, d.desc.slice(0, w - 11), C.dim);
      if (d.src) putStr(x + 7, ry + 2, d.src.slice(0, w - 11), C.frame);
      hitRects.push({ x:x + 1, y:ry, w:w - 2, h:3, i:i });
      ry += 4;
    });
  }

  function drawOver() {
    var w = Math.min(62, cols - 6), h = 9;
    var x = ((cols - w) / 2) | 0, y = ((rows - h) / 2) | 0;
    var win = over_ === "won";
    panel(x, y, w, h, win ? C.us : C.hurt);
    var title = win ? " DAWN " : " THE LANTERN GOES OUT ";
    putStr(x + ((w - title.length) / 2 | 0), y, title, win ? C.us : C.hurt);
    var rowsOut = [
      "survived   " + mmss(t) + " of " + mmss(RUN_LENGTH),
      "put down   " + kills,
      "level      " + you.lv,
      "carried    " + (you.arms.map(function (a) { return a.def.name; }).join(", ")
        || "nothing")
    ];
    rowsOut.forEach(function (s, i) {
      putStr(x + 4, y + 2 + i, s.slice(0, w - 8), i === 0 ? C.ink : C.dim);
    });
    putStr(x + 4, y + h - 2, "press R to walk out again", C.us);
  }

  // ===========================================================================
  // Render
  // ===========================================================================
  function render() {
    var t0 = performance.now();
    buf.fill(0);
    drawField();
    drawShell();
    if (paused && offer) drawLevelUp();
    if (over_) drawOver();

    var ox = 0, oy = 0;
    if (shake > 0) { ox = ri(3) - 1; oy = ri(3) - 1; }
    var bg = flash > 0 ? "#2a0a1a" : "#030308";

    var dirty = 0;
    for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
      var ix = y * cols + x;
      var v = buf[ix] ^ ((ox + oy * 4 + (flash > 0 ? 512 : 0)) << 20);
      if (!forceFull && prev[ix] === v) continue;
      prev[ix] = v; dirty++;
      ctx.fillStyle = bg;
      ctx.fillRect(x * CELL_W, y * CELL_H, CELL_W, CELL_H);
      var cell = buf[ix], gi = cell >> 8;
      if (gi) {
        ctx.fillStyle = PAL[cell & 255];
        ctx.fillText(GLYPHS[gi], x * CELL_W + CELL_W / 2 + ox,
                     y * CELL_H + CELL_H / 2 + oy);
      }
    }
    forceFull = false;
    stat.dirty = dirty;
    stat.ms = stat.ms * 0.88 + (performance.now() - t0) * 0.12;
  }

  // ===========================================================================
  // Damage
  // ===========================================================================
  function num(x, y, v, c) {
    if (fx.length > 260) return;
    fx.push({ k:"num", x:x, y:y, s:String(Math.round(v)), c:c || C.ink, life:0.5, max:0.5 });
  }
  function hurtFoe(m, dmg, colour) {
    m.hp -= dmg;
    m.hurt = 0.07;
    num(m.x, m.y, dmg, colour || C.ink);
    if (m.hp <= 0) {
      m.dead = true;
      kills++;
      fx.push({ k:"pop", x:m.x, y:m.y, c:m.def.c, life:0.22, max:0.22 });
      gems.push({ x:m.x, y:m.y, v:m.def.hp > 20 ? 5 : 1, pull:false });
      if (gems.length > 220) gems.shift();
    }
  }
  function foesIn(x, y, r) {
    var out = [], rr = r * r;
    for (var i = 0; i < foes.length; i++) {
      var m = foes[i];
      if (m.dead) continue;
      var dx = m.x - x, dy = m.y - y;
      if (dx * dx + dy * dy <= rr) out.push(m);
    }
    return out;
  }
  function nearestFoe(x, y, skip) {
    var best = null, bd = 1e9;
    for (var i = 0; i < foes.length; i++) {
      var m = foes[i];
      if (m.dead || (skip && skip.indexOf(m) >= 0)) continue;
      var d = (m.x - x) * (m.x - x) + (m.y - y) * (m.y - y);
      if (d < bd) { bd = d; best = m; }
    }
    return best;
  }

  // ===========================================================================
  // Arms firing
  // ===========================================================================
  function fireArm(a) {
    var p = a.def.per(a.lv), s = statsOf();
    a.t = p.cd * s.haste;

    if (a.def.id === "whip") {
      [1, -1].forEach(function (dir) {
        fx.push({ k:"line", x0:you.x, y0:you.y, x1:you.x + dir * p.len, y1:you.y,
                  g:"~", c:C.us, life:0.2, max:0.2 });
        foesIn(you.x + dir * p.len / 2, you.y, p.len / 2 + 1.5).forEach(function (m) {
          if ((m.x - you.x) * dir > -1) hurtFoe(m, p.dmg, C.us);
        });
      });

    } else if (a.def.id === "knives") {
      var taken = [];
      for (var i = 0; i < p.n; i++) {
        var tgt = nearestFoe(you.x, you.y, taken);
        if (!tgt) break;
        taken.push(tgt);
        var dx = tgt.x - you.x, dy = tgt.y - you.y, L2 = Math.hypot(dx, dy) || 1;
        fx.push({ k:"line", x0:you.x, y0:you.y,
                  x1:you.x + dx / L2 * 34, y1:you.y + dy / L2 * 34,
                  g:"/", c:15, life:0.17, max:0.17 });
        foes.forEach(function (m) {
          if (m.dead) return;
          var t2 = ((m.x - you.x) * dx + (m.y - you.y) * dy) / (L2 * L2);
          if (t2 < 0 || t2 > 1.9) return;
          if (Math.hypot(m.x - (you.x + dx * t2), m.y - (you.y + dy * t2)) < 1.6)
            hurtFoe(m, p.dmg, 15);
        });
      }

    } else if (a.def.id === "censer") {
      fx.push({ k:"ring", x:you.x, y:you.y, r:p.r, g:"o", c:C.us, life:0.34, max:0.34 });
      foesIn(you.x, you.y, p.r).forEach(function (m) { hurtFoe(m, p.dmg, C.us); });

    } else if (a.def.id === "firepot") {
      var tg = nearestFoe(you.x, you.y);
      var cx = tg ? tg.x : you.x + 6, cy = tg ? tg.y : you.y;
      fx.push({ k:"burst", x:cx, y:cy, r:p.r, c:12, life:0.42, max:0.42 });
      foesIn(cx, cy, p.r).forEach(function (m) { hurtFoe(m, p.dmg, 12); });

    } else if (a.def.id === "arc") {
      var from = { x:you.x, y:you.y }, chain = [];
      for (var h = 0; h < p.hops; h++) {
        var nx = nearestFoe(from.x, from.y, chain);
        if (!nx || Math.hypot(nx.x - from.x, nx.y - from.y) > 26) break;
        chain.push(nx);
        fx.push({ k:"line", x0:from.x, y0:from.y, x1:nx.x, y1:nx.y,
                  g:"|", c:11, life:0.22, max:0.22 });
        hurtFoe(nx, p.dmg, 11);
        from = nx;
      }

    } else if (a.def.id === "lantern") {
      fx.push({ k:"wave", x:you.x, y:you.y, r:p.r, c:C.us, life:0.85, max:0.85 });
      foesIn(you.x, you.y, p.r).forEach(function (m) { hurtFoe(m, p.dmg, C.us); });
      flash = 0.16;
    }
  }

  // ===========================================================================
  // Waves and step
  // ===========================================================================
  function spawnWave(dt) {
    var minute = t / 60;
    var want = 45 + minute * 135;
    var rate = Math.min(260, (want - foes.length) * 2.4);
    if (rate <= 0) return;
    you.spawnAcc += rate * dt;
    var pool = FOES.filter(function (f) { return minute >= f.from; });
    while (you.spawnAcc >= 1) {
      you.spawnAcc--;
      var def = pool[ri(pool.length)];
      var an = rnd(Math.PI * 2), rad = F.w * 0.62;
      foes.push({ def:def, x:you.x + Math.cos(an) * rad, y:you.y + Math.sin(an) * rad * 0.9,
                  hp:def.hp * (1 + minute * 0.62), hurt:0, dead:false, ph:rnd(6.3) });
    }
  }

  function step(dt) {
    t += dt;
    shake -= dt; flash -= dt;
    var s = statsOf();

    var mx = 0, my = 0;
    if (keys.a || keys.arrowleft) mx -= 1;
    if (keys.d || keys.arrowright) mx += 1;
    if (keys.w || keys.arrowup) my -= 1;
    if (keys.s || keys.arrowdown) my += 1;
    if (mx || my) {
      var l = Math.hypot(mx, my), v = 13 * s.move * dt;
      you.x += mx / l * v; you.y += my / l * v;
    }
    you.iframe -= dt;

    you.arms.forEach(function (a) {
      if (a.def.kind === "passive") return;
      a.t -= dt;
      if (a.t <= 0) fireArm(a);
    });

    spawnWave(dt);
    var touched = 0;
    for (var i = 0; i < foes.length; i++) {
      var m = foes[i];
      if (m.dead) continue;
      m.hurt -= dt;
      var dx = you.x - m.x, dy = you.y - m.y, d = Math.hypot(dx, dy) || 1;
      var wob = m.def.weave ? Math.sin(t * 5 + m.ph) * 0.55 : 0;
      m.x += (dx / d + (-dy / d) * wob) * m.def.sp * dt;
      m.y += (dy / d + (dx / d) * wob) * m.def.sp * dt;
      if (d < 1.5) touched = Math.max(touched, m.def.dmg);
    }
    if (touched > 0 && you.iframe <= 0) {
      you.hp -= touched;
      you.iframe = 0.42;
      shake = 0.18;
      if (you.hp <= 0) { finish(false); return; }
    }
    foes = foes.filter(function (m) { return !m.dead; });

    for (var gI = gems.length - 1; gI >= 0; gI--) {
      var gm = gems[gI];
      var gdx = you.x - gm.x, gdy = you.y - gm.y, gd = Math.hypot(gdx, gdy) || 1;
      gm.pull = gd < s.pick;
      if (gm.pull) {
        gm.x += gdx / gd * 34 * dt; gm.y += gdy / gd * 34 * dt;
        if (gd < 1.2) {
          you.xp += gm.v;
          gems.splice(gI, 1);
          if (you.xp >= you.need) levelUp();
        }
      }
    }

    for (var e = fx.length - 1; e >= 0; e--) {
      fx[e].life -= dt;
      if (fx[e].life <= 0) fx.splice(e, 1);
    }
    if (t >= RUN_LENGTH) finish(true);
  }

  // ===========================================================================
  // Levelling
  // ===========================================================================
  function say(text) { document.getElementById("say").textContent = text; }

  function levelUp() {
    you.xp -= you.need;
    you.lv++;
    you.need = Math.round(you.need * 1.42 + 4);
    flash = 0.2;

    var owned = you.arms.map(function (a) { return a.def.id; });
    var pool = ARMS.filter(function (d) {
      if (owned.indexOf(d.id) >= 0) {
        var a = you.arms.filter(function (x) { return x.def.id === d.id; })[0];
        return a.lv < 5;
      }
      return you.arms.length < MAX_SLOTS;
    });
    offer = [];
    while (offer.length < 3 && pool.length) offer.push(pool.splice(ri(pool.length), 1)[0]);
    if (!offer.length) { offer = null; return; }
    paused = true;
    forceFull = true;
    say("Level " + you.lv + ". Choose: "
        + offer.map(function (d, i) { return (i + 1) + " " + d.name; }).join(", "));
  }

  function take(d) {
    var have = you.arms.filter(function (x) { return x.def.id === d.id; })[0];
    if (have) have.lv++;
    else you.arms.push({ def:d, lv:1, t:0 });
    if (d.id === "heart") {
      you.maxhp = 100 + statsOf().hp;
      you.hp = Math.min(you.maxhp, you.hp + 22);
    }
    offer = null; hitRects = null;
    paused = false;
    forceFull = true;
    say("Took " + d.name + ".");
  }

  function finish(won) {
    over_ = won ? "won" : "lost";
    paused = true;
    forceFull = true;
    say(won ? "You survived. " + kills + " put down."
            : "You died at " + mmss(t) + ". " + kills + " put down.");
  }

  // ===========================================================================
  // Input
  // ===========================================================================
  function typing(e) {
    var n = e.target;
    return n && (n.tagName === "INPUT" || n.tagName === "TEXTAREA" || n.isContentEditable);
  }
  document.addEventListener("keydown", function (e) {
    if (typing(e)) return;
    var k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k) >= 0) e.preventDefault();
    if (k === "r") { start(); return; }
    if (offer && k >= "1" && k <= "3") {
      var d = offer[+k - 1];
      if (d) take(d);
      return;
    }
    keys[k] = true;
  });
  document.addEventListener("keyup", function (e) {
    if (typing(e)) return;
    keys[e.key.toLowerCase()] = false;
  });
  window.addEventListener("blur", function () { keys = Object.create(null); });

  cv.addEventListener("pointerdown", function (e) {
    if (over_) { start(); return; }
    if (!offer || !hitRects) return;
    var r = cv.getBoundingClientRect();
    var cx = (e.clientX - r.left) / CELL_W, cy = (e.clientY - r.top) / CELL_H;
    for (var i = 0; i < hitRects.length; i++) {
      var h = hitRects[i];
      if (cx >= h.x && cx < h.x + h.w && cy >= h.y && cy < h.y + h.h) {
        take(offer[h.i]);
        return;
      }
    }
  });

  // ===========================================================================
  // Loop
  // ===========================================================================
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (!paused && !over_) step(dt);
    render();
    requestAnimationFrame(frame);
  }

  function start() {
    over_ = null; paused = false; t = 0; kills = 0;
    foes = []; gems = []; fx = []; offer = null; hitRects = null;
    shake = 0; flash = 0;
    stat = { dirty:0, ms:0 };
    you = { x:0, y:0, hp:100, maxhp:100, lv:1, xp:0, need:5,
            arms:[], iframe:0, spawnAcc:0 };
    you.arms.push({ def:ARMS[0], lv:1, t:0.4 });
    resize();
    say("The lantern is lit. Move with WASD.");
  }

  window.addEventListener("resize", function () { resize(); });
  start();
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(function () { forceFull = true; });
  requestAnimationFrame(function (n) { last = n; requestAnimationFrame(frame); });
})();
</script>
